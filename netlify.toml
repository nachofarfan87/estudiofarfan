# Sitio Astro: Netlify compila y publica dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Caché
#
# El HTML no se cachea en el navegador, para que un deploy se vea al instante,
# pero sí en el borde de Netlify: `durable` mantiene la copia en el CDN y
# Netlify la invalida sola en cada publicación. Así el TTFB es de CDN sin
# perder la inmediatez.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, durable"

# Los recursos que emite Astro llevan hash en el nombre: se pueden cachear
# para siempre sin riesgo de servir una versión vieja.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los datos del arancel cambian a diario: poco caché.
[[headers]]
  for = "/honorarios/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/honorarios/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sin esto Netlify lo sirve como application/octet-stream y el manifiesto
# queda en zona gris para instalar la página en el teléfono.
[[headers]]
  for = "/honorarios/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/honorarios/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
